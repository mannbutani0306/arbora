name: Bug report
description: Report a reproducible problem in Arbora
title: '[Bug]: '
labels: ['bug']
body:
  - type: markdown
    attributes:
      value: Share only non-sensitive MiniC examples. Do not include keys, tokens, or private source.
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What happened instead? Include visible error text.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction steps
      description: List minimal steps and, if safe, a minimal MiniC input.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Browser, OS, and commit/branch if known.
    validations:
      required: false
